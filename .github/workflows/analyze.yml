
name: Boat Race Daily Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'data/raw/**'
      - '.github/workflows/analyze.yml'
  schedule:
    - cron: '17 21 * * *'

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run analysis
        run: python scripts/analyze.py

      - name: Save analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis.json
          git diff --cached --quiet || git commit -m "Update analysis results"
          git push
