
name: Boat Race Data Collection Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data collection
        run: python scripts/collect.py

      - name: Run data analysis
        run: python scripts/analyze.py

      - name: Save collected and analyzed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/analysis.json
          if ! git diff --cached --quiet; then
            git commit -m "Update boat race data"
            git push origin HEAD:main
          else
            echo "No data changes"
          fi

      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boat-race-analysis-data
          path: |
            data/raw/
            data/logs/
            data/analysis.json
          if-no-files-found: warn
          retention-days: 3
